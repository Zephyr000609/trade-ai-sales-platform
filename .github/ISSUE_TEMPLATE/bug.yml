name: 缺陷报告
description: 报告可复现的软件问题
title: "[Bug] "
body:
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - P0 数据、安全或关键参数事故
        - P1 主流程不可用
        - P2 有替代方案
        - P3 一般问题
        - P4 优化
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的证据与日志
