name: 功能需求
description: 新功能或完整业务能力
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 用户场景
      description: 谁在什么情况下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: 业务规则与异常情况
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可验证的检查项描述。
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 数据与权限影响
